name: Bump on schedule or request

on:
  workflow_dispatch:
    inputs:
      force:
        description: Refresh downloads and checksums even when versions are current
        type: boolean
        default: false
  schedule:
    - cron: "0 2,8,14,20 * * *"
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  group: autobump
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Check versions and update packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force || false }}
        run: python3 .github/scripts/autobump.py

      - name: Commit and push updates
        run: |
          set -euo pipefail
          git add -- Formula/equilotl-cli.rb Casks/discord+equicord.rb
          if git diff --cached --quiet; then
            echo "Nothing to bump."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in Formula/equilotl-cli.rb Casks/discord+equicord.rb; do
            if git diff --cached --quiet -- "$file"; then
              continue
            fi
            package="${file##*/}"
            package="${package%.rb}"
            case "$package" in
              equilotl-cli)
                version=$(sed -nE 's@.*Equilotl/releases/download/v([^/]+)/EquilotlCli-.*@\1@p' "$file" | sort -u)
                ;;
              discord+equicord)
                version=$(awk '/on_monterey :or_newer do/ { modern = 1; next }
                  modern && $1 == "version" { gsub(/"/, "", $2); print $2; exit }' "$file")
                ;;
            esac
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Could not determine version for $package: $version" >&2
              exit 1
            fi
            git commit -m "$package $version" -- "$file"
          done
          git pull --rebase origin main
          git push origin HEAD:main
