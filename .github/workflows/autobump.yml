name: Bump on schedule or request

on:
  workflow_dispatch:
    inputs:
      force:
        description: Refresh downloads and checksums even when versions are current
        type: boolean
        default: false
  schedule:
    - cron: "0 2,8,14,20 * * *"
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  group: autobump
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Check versions and update packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force || false }}
        run: python3 .github/scripts/autobump.py

      - name: Commit and push updates
        run: |
          set -euo pipefail
          git add -- Formula/equilotl-cli.rb Casks/discord+equicord.rb
          if git diff --cached --quiet; then
            echo "Nothing to bump."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update upstream package versions and checksums"
          git pull --rebase origin main
          git push origin HEAD:main
